name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check api tests src monitoring
      - name: Test
        run: python -m pytest -q
      - name: Docker build
        run: docker build -f api/Dockerfile -t churn-api:${{ github.sha }} .
